<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">drasticstatic.github.io</title>
  <desc id="d">A simple entry point with a clearer atmosphere. The picture: an arch of 7 stones lights from both sides inward until the keystone is reached. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b111f"/><stop offset="1" stop-color="#0a101c"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#ff5bbd"/><stop offset="0.50" stop-color="#72e7ff"/><stop offset="1.00" stop-color="#aef0ff"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#72e7ff" stop-opacity="0"/><stop offset=".35" stop-color="#72e7ff"/><stop offset="1" stop-color="#aef0ff"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M865.1 220A120 120 0 0 1 1105.1 220Z" fill="#203c4c" fill-opacity=".28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M843.1 217.4A142 142 0 0 1 856.1 160.7" fill="none" stroke="#397184" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M858.3 156.1A142 142 0 0 1 894.6 110.6" fill="none" stroke="#4c98ad" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.86s" d="M898.6 107.4A142 142 0 0 1 951.0 82.2" fill="none" stroke="#5fc0d6" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.14s" d="M956.0 81.0A142 142 0 0 1 1014.2 81.0" fill="none" stroke="#aef0ff" stroke-width="34"/>
    <path class="arrive" style="animation-delay:0.86s" d="M1019.2 82.2A142 142 0 0 1 1071.6 107.4" fill="none" stroke="#5fc0d6" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M1075.6 110.6A142 142 0 0 1 1111.9 156.1" fill="none" stroke="#4c98ad" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M1114.1 160.7A142 142 0 0 1 1127.1 217.4" fill="none" stroke="#397184" stroke-width="28"/>
    <circle class="halo" cx="985.1" cy="78.0" r="22" fill="none" stroke="#aef0ff" stroke-width="2"/>
    <circle cx="922.4" cy="139.6" r="1.7" fill="#aef0ff" opacity=".7"/>
    <circle cx="908.6" cy="195.2" r="2.2" fill="#aef0ff" opacity=".7"/>
    <circle cx="941.7" cy="136.5" r="2.8" fill="#aef0ff" opacity=".7"/>
    <circle cx="978.2" cy="137.7" r="2.8" fill="#aef0ff" opacity=".7"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#0d1528"/><rect x="300.0" y="248" width="300.5" height="12" fill="#ff5bbd"/><rect x="600.0" y="248" width="300.5" height="12" fill="#72e7ff"/><rect x="900.0" y="248" width="300.5" height="12" fill="#e0f7ff"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="76.5" fill="#72e7ff" font-size="15" font-weight="700" letter-spacing=".6">Christopher Stephen Wilson · root landing page</text><text x="56" y="134.4" fill="#e0f7ff" font-size="52" font-weight="700" letter-spacing="-.5">drasticstatic.github.io</text><text x="56" y="176.9" fill="#c2d7e0" font-size="23">A simple entry point with a clearer atmosphere.</text></g>
  </g>
</svg>
