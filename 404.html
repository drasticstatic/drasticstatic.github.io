<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=https://drasticstatic.github.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <style>
      :root { color-scheme: dark; --bg: #060816; --text: #e6edf7; --muted: #9fb0c8; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      .message { text-align: center; }
      .message h1 { font-weight: 500; font-size: 1.25rem; margin-bottom: 0.5rem; }
      .message p { color: var(--muted); font-size: 0.875rem; }
      .message a { color: #8a6dff; text-decoration: none; }
      .message a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="message">
      <h1>404 — Not Found</h1>
      <p>Redirecting to <a href="https://drasticstatic.github.io/">drasticstatic.github.io</a>...</p>
    </div>
  </body>
</html>
